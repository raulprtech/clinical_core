name: LUAD publication contracts

on:
  pull_request:
    paths:
      - ".github/workflows/luad-publication.yml"
      - "code/**"
      - "publication/luad_baseline_os_v2/**"
      - "requirements-luad.lock"
      - "tests/**"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luad-publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-free-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-luad.lock
      - name: Install frozen direct environment
        run: python -m pip install -r requirements-luad.lock
      - name: Contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Component tests
        run: python -m unittest discover -s code/tests -p 'test_*.py' -q
      - name: Verify aggregate publication package
        run: python code/tools/verify_luad_publication_package.py
