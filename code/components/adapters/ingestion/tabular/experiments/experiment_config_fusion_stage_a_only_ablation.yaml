# ============================================================
# CLINICAL-CORE / FUSION-PROC — ABLATION: Stage A only (NO Stage B)
# ============================================================
# Tests whether VAE Stage B (triplet contrastive by survival) is the
# principal contributor to the CV-vs-holdout gap of +0.183.
#
# Exact YAML paths verified against experiment_runner.py:
#   - phase_6_fusion_proc.training.stage_b.epochs  → epochs_stage_b in VAEGenTrainConfig
#   - phase_6_fusion_proc.training.loss_weights.*  → alpha_recon/beta_kl/delta_contra
#   - phase_6_fusion_proc.model_params.*           → d_latent/hidden_dims/dropout
#
# Setting stage_b.epochs = 0 keeps Stage B's training loop from executing.
# Phase 6 produces a fresh `phase_6_latent_z.npz` artifact with Z trained
# only with Stage A (reconstruction + KL, no triplet). Phase 8 consumes
# that artifact automatically (artifact discovery precedence: current run
# first, then most recent prior run). Phase 7 also enabled to verify
# quantization behavior on a Stage-A-only Z.
#
# Decision rule (ex-ante):
#   • holdout >= 0.78  AND  gap <= 0.08  → Stage B is the driver. Remove.
#   • holdout 0.72-0.78, gap 0.08-0.13   → Partial. Investigate encoder.
#   • holdout < 0.72  OR  gap > 0.13     → Stage B not the driver. Reframe.
#
# Expected runtime: ~20-30 min (Phase 6 + Phase 8 + Phase 7).
# ============================================================

experiment:
  name: "fusion_stage_a_only_ablation"
  description: "Disable VAE Stage B by setting epochs=0. Re-evaluate Phase 8 under identical CV in-pool + holdout protocol. Identifies whether Stage B drives the CV-vs-holdout gap of +0.183."
  author: "Raul Pacheco"
  protocol_version: "v8"

# ============================================================
# DATA
# ============================================================
data:
  xml_dir: "/home/raulprtech/clinical_core/data/raw/clinicalsupplement"
  feature_config: "../configs/tabular_mapping_no_leakage.yaml"
  drug_file: null

output:
  base_dir: "/home/raulprtech/clinical_core/results"
  save_raw_extraction: true
  save_resolved_config: true

# ============================================================
# RANDOM CONTROLS
# Phase 6 uses random.seed (single value); phases 7/8 use random.seeds list.
# ============================================================
random:
  seed: 42                        # used by phase_6_fusion_proc
  seeds: [42, 123, 456, 789, 1024]
  n_folds: 5

# ============================================================
# Phases 1-5 disabled — we only need 6 (new VAE without Stage B),
# 7 (quantization on the new Z), and 8 (Cox vs Weibull on the new Z).
# ============================================================
phase_1_imputation:         { enabled: false }
phase_2_variants:           { enabled: false }
phase_2_external_baselines: { enabled: false }
phase_3_efficiency:         { enabled: false }
phase_4_stress:             { enabled: false }
phase_5_multimodal:         { enabled: false }

# ============================================================
# PHASE 6 — FUSION-PROC (VAE Stage A only via epochs_stage_b=0)
# ============================================================
phase_6_fusion_proc:
  enabled: true

  # Mock text/vision (same as the corrida that produced +0.183 gap)
  modalities: ["tabular", "text", "vision"]
  modality_dim: 768

  # Imputation (unchanged)
  tabular_imputation: "knn_5"

  # Hold-out / VAE val splits (unchanged from the corrida being compared)
  holdout_fraction: 0.20
  val_fraction: 0.15
  encoder_val_fraction: 0.15

  # Linear-compact tabular encoder (unchanged)
  encoder_params:
    hidden_dim: 128
    epochs: 200
    lr: 0.001
    patience: 20

  # Use the generative VAE component registered in the registry
  fusion_proc: "fusion_vae_generative"

  # VAE architecture (same as the post-adendum reduced-capacity run)
  model_params:
    d_latent: 64
    hidden_dims: [256, 128]
    dropout: 0.2

  # === THE ONE CHANGE: stage_b.epochs = 0 disables Stage B ===
  training:
    stage_a:
      epochs: 100
      lr: 0.001
      patience: 20
      kl_anneal_epochs: 30

    stage_b:
      epochs: 0                  # ← disables triplet contrastive training
      lr: 0.0003
      patience: 15
      triplet_margin: 1.0
      time_similar_window: 180.0

    loss_weights:
      alpha_recon: 1.0
      beta_kl: 0.1
      delta_contra: 0.5          # ignored when stage_b.epochs = 0

    train_with_masking: false
    modality_dropout_prob: 0.3
    weight_decay: 0.0001
    batch_size: 64

# ============================================================
# PHASE 7 — TurboLatent on the new Stage-A-only Z
# Consumes the artifact produced by Phase 6 above (same run).
# Optional: comment out if you only want the Phase 8 result first.
# ============================================================
phase_7_turbolatent:
  enabled: true
  variants: ["hadamard", "svd"]
  bit_widths: [8, 6, 4, 3]
  include_baseline_no_rotation: true
  prognosis_proc: "prognosis_baseline_linear_cox"
  epochs: 200
  patience: 20

# ============================================================
# PHASE 8 — PROGNOSIS benchmark (the metric that matters)
# Reports CV in-pool AND held-out per model.
# ============================================================
phase_8_prognosis_benchmark:
  enabled: true
  epochs: 200
  patience: 20
  models:
    - name: "prognosis_baseline_linear_cox"
    - name: "prognosis_weibull_head"

runtime:
  verbosity: "normal"
  fail_fast: false
  max_phase_minutes: null