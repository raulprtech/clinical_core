# ============================================================
# CLINICAL-CORE — Bimodal fusion (tabular + REAL text), n≈224 subcohort
# ============================================================
# Mismo pipeline que experiment_config_fusion_bimodal_text_n444.yaml, pero
# aplicando el cohort_filter para reducir al subcohort MMEM-comparable
# (DFS válido + 4 modalidades en GDC, n=224).
#
# Esta es la cifra ESTRATÉGICA para Paper 2: validar si el bimodal real
# cierra/supera la brecha contra MMEM Clinical-only (0.785).
# Referencia unimodal linear_compact n=224 = 0.753 ± 0.037.
# ============================================================

experiment:
  name: "fusion_bimodal_text_subcohort_dfs5mod"
  description: "Bimodal tabular + text (Kefeli+ClinicalBERT off-the-shelf), MMEM-comparable subcohort n=224."
  author: "Raul Pacheco"
  protocol_version: "v8.1"

data:
  xml_dir: "/home/raulprtech/clinical_core/data/raw/clinicalsupplement"
  feature_config: "../configs/tabular_mapping_no_leakage.yaml"
  drug_file: null

output:
  base_dir: "/home/raulprtech/clinical_core/results"
  save_raw_extraction: true
  save_resolved_config: true

random:
  seed: 42
  seeds: [42, 123, 456, 789, 1024]
  n_folds: 5

# >>> Filtro de cohort: subcohort MMEM-comparable <<<
cohort_filter:
  enabled: true
  require_dfs_valid: true
  modality_manifest_path: "/home/raulprtech/clinical_core/data/manifests/gdc_modality_manifest_TCGA-KIRC_20260528.csv"
  require_modalities: [wsi, mrna_seq, mirna_seq, methylation_450k]

phase_1_imputation:          { enabled: false }
phase_2_variants:            { enabled: false }
phase_2_holdout:             { enabled: false }
phase_2_external_baselines:  { enabled: false }
phase_2_external_holdout:    { enabled: false }
phase_2_mahootiha:           { enabled: false }
phase_3_efficiency:          { enabled: false }
phase_4_stress:              { enabled: false }
phase_5_multimodal:          { enabled: false }

phase_6_fusion_proc:
  enabled: true

  modalities: ["tabular", "text"]
  modality_dim: 768

  text_embeddings_cache: "/home/raulprtech/clinical_core/data/embeddings/text_embeddings_TCGA-KIRC_20260528.npz"

  tabular_imputation: "knn_5"
  holdout_fraction: 0.20
  val_fraction: 0.15
  encoder_val_fraction: 0.15

  encoder_params:
    hidden_dim: 128
    epochs: 200
    lr: 0.001
    patience: 20

  fusion_proc: "fusion_vae_generative"

  model_params:
    d_latent: 64
    hidden_dims: [256, 128]
    dropout: 0.2

  training:
    stage_a:
      epochs: 100
      lr: 0.001
      patience: 20
      kl_anneal_epochs: 30

    stage_b:
      epochs: 0     # Stage B OUT per §6.3.1 decisión operativa
      lr: 0.0003
      patience: 15
      triplet_margin: 1.0
      time_similar_window: 180.0

    loss_weights:
      alpha_recon: 1.0
      beta_kl: 0.1
      delta_contra: 0.5

    train_with_masking: false
    modality_dropout_prob: 0.3
    weight_decay: 0.0001
    batch_size: 64

phase_7_turbolatent:
  enabled: true
  variants: ["hadamard", "svd"]
  bit_widths: [8, 6, 4, 3]
  include_baseline_no_rotation: true
  prognosis_proc: "prognosis_baseline_linear_cox"
  epochs: 200
  patience: 20

phase_8_prognosis_benchmark:
  enabled: true
  epochs: 200
  patience: 20
  models:
    - name: "prognosis_baseline_linear_cox"
    - name: "prognosis_weibull_head"

runtime:
  verbosity: "normal"
  fail_fast: false
  max_phase_minutes: null
