# ============================================================
# CLINICAL-CORE / TABULAR-IN — Mahootiha 2024 replication on 22 features (WITH LEAKAGE)
# ============================================================
# Aplica el método de Mahootiha sobre las 22 features que incluyen las 3
# variables de leakage (karnofsky_score, ecog_score, tumor_status). Pretende
# REPLICAR su cifra original ~0.84 y exhibir explícitamente cómo el ranking
# Spearman+RF deja pasar las variables post-evento (Hallazgo 2 / §5.3).
#
# Para el contraste "honesto" (sin leakage), correr el YAML hermano
# experiment_config_mahootiha_19.yaml.
# ============================================================

experiment:
  name: "mahootiha_22_with_leakage"
  description: "Mahootiha 2024 feature ranking + Cox over top-K on 22 features (anti-leakage + 3 leakage vars)."
  author: "Raul Pacheco"
  protocol_version: "v8.1"

data:
  xml_dir: "/home/raulprtech/clinical_core/data/raw/clinicalsupplement"
  feature_config: "../configs/tabular_mapping_22_with_leakage.yaml"
  drug_file: null

output:
  base_dir: "/home/raulprtech/clinical_core/results"
  save_raw_extraction: true
  save_resolved_config: true

random:
  seeds: [42, 123, 456, 789, 1024]
  n_folds: 5

# Todas las fases off salvo Mahootiha
phase_1_imputation:          { enabled: false }
phase_2_variants:            { enabled: false }
phase_2_holdout:             { enabled: false }
phase_2_external_baselines:  { enabled: false }
phase_2_external_holdout:    { enabled: false }
phase_3_efficiency:          { enabled: false }
phase_4_stress:              { enabled: false }
phase_5_multimodal:          { enabled: false }
phase_6_fusion_proc:         { enabled: false }
phase_7_turbolatent:         { enabled: false }
phase_8_prognosis_benchmark: { enabled: false }

phase_2_mahootiha:
  enabled: true
  holdout_fraction: 0.20
  seeds: [42, 123, 456, 789, 1024]
  k_values: [5, 10, 15, null]   # null = todas las features (22 aquí)
  imputation: "knn_5"
  rf_n_estimators: 200
  output_dim: 768

runtime:
  verbosity: "normal"
  fail_fast: false
