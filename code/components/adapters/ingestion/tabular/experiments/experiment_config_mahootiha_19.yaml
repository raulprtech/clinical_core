# ============================================================
# CLINICAL-CORE / TABULAR-IN — Mahootiha 2024 replication on 19 anti-leakage features
# ============================================================
# Aplica el método de Mahootiha (Spearman corr + RF importance, combined rank)
# sobre nuestras 19 features anti-leakage. Reporta C-index held-out 80/20 para
# K ∈ {5, 10, 15, 19}.
#
# Pregunta clínica: si Mahootiha aplicara su propio método de selección sobre
# nuestro feature set sin leakage, ¿llegaría a su 0.84 reportado, o caería
# hacia nuestro 0.81 cox_baseline?
#
# Para el contraste "Mahootiha original" (con leakage), correr el YAML hermano
# experiment_config_mahootiha_22.yaml.
# ============================================================

experiment:
  name: "mahootiha_19_antileakage"
  description: "Mahootiha 2024 feature ranking + Cox over top-K on the 19 anti-leakage features."
  author: "Raul Pacheco"
  protocol_version: "v8.1"

data:
  xml_dir: "/home/raulprtech/clinical_core/data/raw/clinicalsupplement"
  feature_config: "../configs/tabular_mapping_no_leakage.yaml"
  drug_file: null

output:
  base_dir: "/home/raulprtech/clinical_core/results"
  save_raw_extraction: true
  save_resolved_config: true

random:
  seeds: [42, 123, 456, 789, 1024]
  n_folds: 5

# Todas las fases off salvo Mahootiha
phase_1_imputation:          { enabled: false }
phase_2_variants:            { enabled: false }
phase_2_holdout:             { enabled: false }
phase_2_external_baselines:  { enabled: false }
phase_2_external_holdout:    { enabled: false }
phase_3_efficiency:          { enabled: false }
phase_4_stress:              { enabled: false }
phase_5_multimodal:          { enabled: false }
phase_6_fusion_proc:         { enabled: false }
phase_7_turbolatent:         { enabled: false }
phase_8_prognosis_benchmark: { enabled: false }

phase_2_mahootiha:
  enabled: true
  holdout_fraction: 0.20
  seeds: [42, 123, 456, 789, 1024]
  k_values: [5, 10, 15, null]   # null = todas las features
  imputation: "knn_5"
  rf_n_estimators: 200
  output_dim: 768

runtime:
  verbosity: "normal"
  fail_fast: false
