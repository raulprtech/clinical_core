# ============================================================
# CLINICAL-CORE — DIAGNÓSTICO: Late fusion (skip VAE), n=444
# ============================================================
# Pregunta: ¿el cuello del bimodal V1 (-0.025 vs unimodal) es el encoder
# off-the-shelf o el VAE FUSION-PROC?
#
# Setup: linear_compact encoder (tabular) + Bio_ClinicalBERT cache (text) →
# concat 1536-dim → linear Cox head. NO PASA POR EL VAE.
#
# Lectura del resultado (vs unimodal linear_compact n=444 = 0.7678):
#   - Si concat > 0.768 → VAE diluye. Rediseñar FUSION-PROC (gating/atención).
#   - Si concat ≈ 0.768 → text off-the-shelf no aporta. V2 fine-tune.
#   - Si concat < 0.768 → late fusion también tiene overfitting; problema más profundo.
# ============================================================

experiment:
  name: "late_fusion_text_n444"
  description: "Diagnostic: late fusion (concat tab_emb + text_emb → Cox head), n=444."
  author: "Raul Pacheco"
  protocol_version: "v8.1"

data:
  xml_dir: "/home/raulprtech/clinical_core/data/raw/clinicalsupplement"
  feature_config: "../configs/tabular_mapping_no_leakage.yaml"
  drug_file: null

output:
  base_dir: "/home/raulprtech/clinical_core/results"
  save_raw_extraction: true
  save_resolved_config: true

random:
  seeds: [42, 123, 456, 789, 1024]
  n_folds: 5

# Resto de fases off
phase_1_imputation:           { enabled: false }
phase_2_variants:             { enabled: false }
phase_2_holdout:              { enabled: false }
phase_2_external_baselines:   { enabled: false }
phase_2_external_holdout:     { enabled: false }
phase_2_mahootiha:            { enabled: false }
phase_3_efficiency:           { enabled: false }
phase_4_stress:               { enabled: false }
phase_5_multimodal:           { enabled: false }
phase_6_fusion_proc:          { enabled: false }
phase_7_turbolatent:          { enabled: false }
phase_8_prognosis_benchmark:  { enabled: false }

# >>> Solo late-fusion diagnostic <<<
phase_2_late_fusion_holdout:
  enabled: true
  holdout_fraction: 0.20
  seeds: [42, 123, 456, 789, 1024]
  imputation: "knn_5"
  text_embeddings_cache: "/home/raulprtech/clinical_core/data/embeddings/text_embeddings_TCGA-KIRC_20260528.npz"
  encoder_params:
    hidden_dim: 128
    epochs: 200
    lr: 0.001
    patience: 20
    weight_decay: 0.0001
  cox_head:
    epochs: 200
    patience: 20
    lr: 0.001
    weight_decay: 0.001

runtime:
  verbosity: "normal"
  fail_fast: false
