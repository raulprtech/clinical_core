# ============================================================
# CLINICAL-CORE — TurboLatent sobre concat 1536-dim (late fusion), n=444
# ============================================================
# Tras el diagnóstico del 2026-05-28: el FUSION-PROC operacional pasa de
# VAE Stage A a late fusion concat. Este YAML re-evalúa Paper 3 (TurboLatent)
# sobre el nuevo latent = concat 1536-dim.
#
# Hipótesis: la rotación de Walsh-Hadamard preserva en concat (la anisotropía
# probablemente sea mayor que en Z_64 — tabular y text tienen escalas distintas).
# Si Hadamard INT3 ≈ FP32 baseline, Paper 3 sobrevive el cambio arquitectónico.
# ============================================================

experiment:
  name: "late_fusion_turbolatent_n444"
  description: "Late fusion concat as Z; TurboLatent (Hadamard / SVD × bitwidths) on 1536-dim."
  author: "Raul Pacheco"
  protocol_version: "v8.1"

data:
  xml_dir: "/home/raulprtech/clinical_core/data/raw/clinicalsupplement"
  feature_config: "../configs/tabular_mapping_no_leakage.yaml"
  drug_file: null

output:
  base_dir: "/home/raulprtech/clinical_core/results"
  save_raw_extraction: true
  save_resolved_config: true

random:
  seed: 42
  seeds: [42, 123, 456, 789, 1024]
  n_folds: 5

phase_1_imputation:           { enabled: false }
phase_2_variants:             { enabled: false }
phase_2_holdout:              { enabled: false }
phase_2_external_baselines:   { enabled: false }
phase_2_external_holdout:     { enabled: false }
phase_2_mahootiha:            { enabled: false }
phase_2_late_fusion_holdout:  { enabled: false }
phase_3_efficiency:           { enabled: false }
phase_4_stress:               { enabled: false }
phase_5_multimodal:           { enabled: false }

# >>> Phase 6 con late_fusion_mode = SKIP VAE, Z = concat 1536 <<<
phase_6_fusion_proc:
  enabled: true
  late_fusion_mode: true

  modalities: ["tabular", "text"]
  modality_dim: 768

  text_embeddings_cache: "/home/raulprtech/clinical_core/data/embeddings/text_embeddings_TCGA-KIRC_20260528.npz"

  tabular_imputation: "knn_5"
  holdout_fraction: 0.20
  val_fraction: 0.15
  encoder_val_fraction: 0.15

  encoder_params:
    hidden_dim: 128
    epochs: 200
    lr: 0.001
    patience: 20

  # NOTE: con late_fusion_mode=true los model_params del VAE se ignoran (no se entrena VAE).
  # Los dejamos por compatibilidad con el resto del código.
  fusion_proc: "fusion_vae_generative"
  model_params:
    d_latent: 64
    hidden_dims: [256, 128]
    dropout: 0.2

  training:
    stage_a: { epochs: 0, lr: 0.001, patience: 20, kl_anneal_epochs: 30 }
    stage_b: { epochs: 0, lr: 0.0003, patience: 15, triplet_margin: 1.0, time_similar_window: 180.0 }
    loss_weights: { alpha_recon: 1.0, beta_kl: 0.1, delta_contra: 0.5 }
    train_with_masking: false
    modality_dropout_prob: 0.3
    weight_decay: 0.0001
    batch_size: 64

phase_7_turbolatent:
  enabled: true
  variants: ["hadamard", "svd"]
  bit_widths: [8, 6, 4, 3]
  include_baseline_no_rotation: true
  prognosis_proc: "prognosis_baseline_linear_cox"
  epochs: 200
  patience: 20
  # Phase 7 held-out evaluation uses the FIXED split from Phase 6 (seed=42).
  # This is intentionally different from Paper 2 Hallazgo 6, which uses
  # per-seed splits with per-seed encoders. Aligning would require Phase 6
  # to emit 5 artifacts; see memory text_in_v1_result.md for the rationale.

phase_8_prognosis_benchmark:
  enabled: true
  epochs: 200
  patience: 20
  models:
    - name: "prognosis_baseline_linear_cox"
    - name: "prognosis_weibull_head"

runtime:
  verbosity: "normal"
  fail_fast: false
  max_phase_minutes: null
