# TCGA-LUAD retrospective clinicopathologic overall-survival contract.
contract:
  id: tcga-luad-baseline-os-v2
  project_id: TCGA-LUAD
  excluded_project_ids: [TCGA-LUSC]
  task_type: prognosis
  prediction_time: retrospective_pathology_baseline
  endpoint: overall_survival
  time_origin: initial_pathologic_diagnosis
  claim_scope: retrospective_association_not_postoperative_landmark
  source_policy: gdc_clinical_supplement_by_reference

targets:
  survival_days:
    sources: [days_to_death, days_to_last_follow_up, days_to_follow_up, days_to_last_followup]
    aggregation: latest_positive_observation
    description: "OS or censoring time from initial pathologic diagnosis."
  vital_status:
    sources: [vital_status]
    mapping: {Dead: 1, Alive: 0}
  diagnosis_year:
    sources: [year_of_initial_pathologic_diagnosis]
    type: continuous
    role: partition_only
    description: "Calendar year used only for temporal transport evaluation; never a model feature."

features:
  age:
    sources: [age_at_initial_pathologic_diagnosis]
    type: continuous
    normalization: zscore
  gender:
    sources: [gender]
    type: categorical
    mapping: {MALE: 1, FEMALE: 0}
  race:
    sources: [race]
    type: categorical
    encoding: onehot
    mapping:
      WHITE: 0
      BLACK OR AFRICAN AMERICAN: 1
      ASIAN: 2
      OTHER: 3
  ethnicity:
    sources: [ethnicity]
    type: categorical
    mapping:
      HISPANIC OR LATINO: 1
      NOT HISPANIC OR LATINO: 0
  pathologic_stage:
    sources: [ajcc_pathologic_stage, ajcc_pathologic_tumor_stage, pathologic_stage, tumor_stage]
    type: categorical
    encoding: ordinal
    mapping:
      Stage IA: 1
      Stage IA1: 1
      Stage IA2: 1
      Stage IA3: 1
      Stage IB: 1
      Stage I: 1
      Stage IIA: 2
      Stage IIB: 2
      Stage II: 2
      Stage IIIA: 3
      Stage IIIB: 3
      Stage IIIC: 3
      Stage III: 3
      Stage IVA: 4
      Stage IVB: 4
      Stage IV: 4
  pathologic_T:
    sources: [ajcc_pathologic_t, ajcc_tumor_pathologic_pt, pathologic_t]
    type: categorical
    encoding: ordinal
    mapping: {T1mi: 1, T1a: 1, T1b: 1, T1c: 1, T1: 1, T2a: 2, T2b: 2, T2: 2, T3: 3, T4: 4}
  pathologic_N:
    sources: [ajcc_pathologic_n, ajcc_nodes_pathologic_pn, pathologic_n]
    type: categorical
    encoding: ordinal
    mapping: {N0: 0, N1: 1, N2: 2, N3: 3, NX: -1}
  pathologic_M:
    sources: [ajcc_pathologic_m, ajcc_metastasis_pathologic_pm, pathologic_m]
    type: categorical
    encoding: ordinal
    mapping: {M0: 0, M1: 1, M1a: 1, M1b: 1, M1c: 1, MX: -1}
  pack_years_smoked:
    sources: [pack_years_smoked, number_pack_years_smoked]
    type: continuous
    normalization: zscore

audit:
  longitudinal_follow_up:
    files_with_multiple_values: 314
    first_value_not_latest: 263
    policy: maximum_positive_days_per_patient
  excluded_candidates:
    cigarettes_per_day: {reason: observed_coverage_zero}
    tobacco_smoking_status: {reason: dictionary_harmonization_pending}
    asbestos_exposure_type: {reason: coverage_and_temporal_audit_pending}
