experiment:
  name: "TCGA-KIRC trimodal — tabular + ClinicalBERT + ResNet18 2.5D"
  author: "Raul Pacheco"
  protocol_version: "trimodal-v1"

clinical_context:
  moment: "post_surgery"
  pathology_modalities: [text]

data:
  xml_dir: "/home/raulprtech/clinical_core/data/raw/clinicalsupplement"
  feature_config: "../components/adapters/ingestion/tabular/configs/tabular_mapping_no_leakage.yaml"
  drug_file: null

output:
  base_dir: "/home/raulprtech/clinical_core/results_trimodal"
  save_raw_extraction: true
  save_resolved_config: true

random:
  seeds: [42, 123, 456, 789, 1024]
  n_folds: 5

runtime:
  verbosity: "normal"
  fail_fast: true

phase_1_imputation:
  enabled: false

phase_2_variants:
  enabled: false
  imputation_for_variants: "knn_5"

phase_3_efficiency:
  enabled: false

phase_4_stress:
  enabled: false

phase_5_multimodal:
  enabled: true
  clinical_moment: "post_surgery"
  modalities: [tabular, text, vision]
  modality_dim: 768
  tabular_imputation: "knn_5"

  text_conn: "text_baseline_docling_clinicalbert"
  text_embeddings_npz: "/home/raulprtech/clinical_core/data/embeddings/text_embeddings_TCGA-KIRC_20260528.npz"
  text_dir: null

  vision_conn: "vision_resnet18_2p5d"
  vision_embeddings_csv: "/home/raulprtech/clinical_core/data/embeddings/vision/vision_resnet18_2p5d_embeddings_768.csv"
  vision_dir: null
  vision_params:
    use_imagenet_weights: true
    image_size: 224
    aggregation: "mean3"
    window_low: -150
    window_high: 250
    min_slices: 16
    slice_offsets: [-1, 0, 1]
    projection_seed: 2026
    device: "auto"
    weights_dir: "/home/raulprtech/clinical_core/data/models/torch"

  fusion_proc: "fusion_baseline_concat"
  prognosis_proc: "prognosis_baseline_linear_cox"
  prognosis_epochs: 200
  prognosis_patience: 20
  inner_validation_fraction: 0.20
  ablations:
    - [tabular]
    - [text]
    - [vision]
    - [tabular, text, vision]

phase_6_fusion_proc: {enabled: false}
phase_7_turbolatent: {enabled: false}
phase_8_prognosis_benchmark: {enabled: false}
