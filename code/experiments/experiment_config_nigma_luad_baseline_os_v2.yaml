experiment:
  name: "nigma_tcga_luad_baseline_os_v2"
  description: "TCGA-LUAD retrospective clinicopathologic OS baseline; not a postoperative landmark claim."
  author: "Raul Pacheco"
  protocol_version: "nigma-luad-v2"

disease_contract:
  id: "tcga-luad-baseline-os-v2"
  project_id: "TCGA-LUAD"
  excluded_project_ids: ["TCGA-LUSC"]
  source_status: "local_verified_522_patient_xml"

clinical_context:
  moment: "retrospective_pathology_baseline"
  time_origin: "initial_pathologic_diagnosis"
  landmark_available: false
  claim_scope: "retrospective_association_not_postoperative_landmark"
  pathology_modalities: []

data:
  xml_dir: "../../data/raw/TCGA-LUAD/clinical_supplement"
  feature_config: "../components/adapters/ingestion/tabular/configs/tabular_mapping_tcga_luad_baseline_os_v2.yaml"
  drug_file: null

output:
  base_dir: "../../results_nigma_dry_run/luad_baseline_os_v2"
  save_raw_extraction: false
  save_resolved_config: true

random: {seeds: [42], n_folds: 2}
phase_1_imputation: {enabled: false}
phase_2_variants: {enabled: false}
phase_2_holdout:
  enabled: true
  holdout_fraction: 0.20
  seeds: [42]
  variants: [cox_baseline]
  output_dim: 768
  imputation_for_baseline: mean_median
  imputation_for_variants: mean_median
  onehot_features: [race]
  onehot_drop_first: true
  calibration_horizon_days: 730
  bootstrap_iterations: 1000
  bootstrap_confidence_level: 0.95
  ipcw_tau_days: 730
  save_artifacts: false
  protocols:
    - name: stage_model
      drop_features: [pathologic_T, pathologic_N, pathologic_M]
    - name: tnm_model
      drop_features: [pathologic_stage]
    - name: stage_tnm_model
      drop_features: []
phase_2_repeated_cv:
  enabled: true
  seeds: [42, 101, 202]
  n_folds: 5
  variants: [cox_baseline]
  output_dim: 768
  imputation: mean_median
  onehot_features: [race]
  onehot_drop_first: true
  calibration_horizon_days: 730
  ipcw_tau_days: 730
  save_artifacts: false
  protocols:
    - name: stage_model
      drop_features: [pathologic_T, pathologic_N, pathologic_M]
    - name: tnm_model
      drop_features: [pathologic_stage]
    - name: stage_tnm_model
      drop_features: []
phase_2_temporal_validation:
  enabled: true
  cutoff_year: 2007
  partition_field: diagnosis_year
  interpretation: internal_temporal_transport_not_external_validation
  variants: [cox_baseline]
  output_dim: 768
  imputation: mean_median
  onehot_features: [race]
  onehot_drop_first: true
  calibration_horizon_days: 730
  bootstrap_iterations: 1000
  bootstrap_confidence_level: 0.95
  bootstrap_seed: 42
  ipcw_tau_days: 730
  save_artifacts: false
  protocols:
    - name: stage_model
      drop_features: [pathologic_T, pathologic_N, pathologic_M]
    - name: tnm_model
      drop_features: [pathologic_stage]
    - name: stage_tnm_model
      drop_features: []
phase_2_external_baselines: {enabled: false}
phase_2_external_holdout: {enabled: false}
phase_2_mahootiha: {enabled: false}
phase_2_late_fusion_holdout: {enabled: false}
phase_2_text_only_nested_cv: {enabled: false}
phase_3_efficiency: {enabled: false}
phase_4_stress: {enabled: false}
phase_5_multimodal: {enabled: false}
phase_6_fusion_proc: {enabled: false}
phase_7_turbolatent: {enabled: false}
phase_8_prognosis_benchmark: {enabled: false}
runtime: {verbosity: normal, fail_fast: true, max_phase_minutes: 5}
