# Honest post-surgery evaluation of pathology-report text only.
#
# Cohort policy: modality-specific. A patient enters this experiment only when
# both overall survival and a real (confidence > 0) pathology-report embedding
# are available. No other modality is required.

experiment:
  name: "text_only_postop_nested_cv"
  description: "Bio_ClinicalBERT pathology reports with inner validation and untouched outer-fold testing."
  author: "Raul Pacheco"
  protocol_version: "v9.0"

clinical_context:
  moment: "post_surgery"
  pathology_modalities: [text]

data:
  xml_dir: "/home/raulprtech/clinical_core/data/raw/clinicalsupplement"
  feature_config: "../components/adapters/ingestion/tabular/configs/tabular_mapping_no_leakage.yaml"
  drug_file: null

output:
  base_dir: "/home/raulprtech/clinical_core/results"
  save_raw_extraction: true
  save_resolved_config: true

random:
  seeds: [42, 123, 456, 789, 1024]
  n_folds: 5

phase_1_imputation:          { enabled: false }
phase_2_variants:            { enabled: false }
phase_2_holdout:             { enabled: false }
phase_2_external_baselines:  { enabled: false }
phase_2_external_holdout:    { enabled: false }
phase_2_mahootiha:           { enabled: false }
phase_2_late_fusion_holdout: { enabled: false }

phase_2_text_only_nested_cv:
  enabled: true
  clinical_moment: "post_surgery"
  text_embeddings_cache: "/home/raulprtech/clinical_core/data/embeddings/text_embeddings_TCGA-KIRC_20260528.npz"
  min_confidence: 0.0
  seeds: [42, 123, 456, 789, 1024]
  n_folds: 5
  validation_fraction: 0.20
  epochs: 200
  patience: 20
  lr: 0.001
  weight_decay: 0.001

phase_3_efficiency:          { enabled: false }
phase_4_stress:              { enabled: false }
phase_5_multimodal:          { enabled: false }
phase_6_fusion_proc:         { enabled: false }
phase_7_turbolatent:         { enabled: false }
phase_8_prognosis_benchmark: { enabled: false }

# Do not enable a global intersection of modalities. Future unimodal and
# multimodal experiments select the maximal cohort needed by their own subset.
cohort_filter:
  enabled: false
  modality_policy: "per_modality"

runtime:
  verbosity: "normal"
  fail_fast: true
